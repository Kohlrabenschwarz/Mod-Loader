name: Import release source

on:
  release:
    types: [edited]

permissions:
  contents: write

jobs:
  import-source:
    if: github.event.release.tag_name == 'v1.0.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and unpack the reviewed source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Mod-Loader-v1.0.0-source.zip"
          source_dir="$RUNNER_TEMP/mod-loader-source"
          curl --fail --location --retry 5 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v1.0.0/Mod-Loader-v1.0.0-source.zip" \
            --output "$archive"
          mkdir -p "$source_dir"
          unzip -q "$archive" -d "$source_dir"
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"

      - name: Add the core and privileged file modules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kohlrabenschwarz"
          git config user.email "331034167+Kohlrabenschwarz@users.noreply.github.com"
          cp -a "$SOURCE_DIR/domain" "$SOURCE_DIR/engine" "$SOURCE_DIR/bridge" .
          git add domain engine bridge
          git commit -m "feat(core): add archive validation and privileged recovery" \
            -m "Adds the domain parser, UnityFS and path checks, Shizuku bridge, transactional file engine, SHA state, backups, rollback support, and their tests."

      - name: Add the Android application
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$SOURCE_DIR/app" .
          git add app
          git commit -m "feat(app): add the localized Compose mod library" \
            -m "Adds the application module with mod import and activation flows, agreement screen, six languages, themes, update checks, Shizuku status, recovery actions, and game launch."

      - name: Add project automation, examples, and notices
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$SOURCE_DIR/.github" "$SOURCE_DIR/docs" "$SOURCE_DIR/examples" \
            "$SOURCE_DIR/gradle" "$SOURCE_DIR/licenses" .
          git rm .github/workflows/import-source.yml
          git add .github docs examples gradle licenses
          git commit -m "build: add CI, wrapper, examples, and release guidance" \
            -m "Adds reproducible Gradle wrapper files, dependency automation, CI checks, the safe UnityFS template, third-party license inventory, and the v1.0.0 release guide. Removes the one-time source importer."

      - name: Verify and publish the imported tree
        shell: bash
        run: |
          set -euo pipefail
          diff -qr --strip-trailing-cr --exclude=.git "$SOURCE_DIR" "$GITHUB_WORKSPACE"
          git push origin HEAD:main
